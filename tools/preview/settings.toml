# メニューを描く画面の選択はここだけ。実機向けのコードは変更しない。
screen = "bottom"
frame_ms = 16
background = [32, 40, 48]

# 実機との較正で調整する値。画面座標と全ての合成に共通。
[raster]
offset = [0, 0]
alpha_gain = 1.0
rgb_gain = [1.0, 1.0, 1.0]
swap_red_blue = false
rounding = "nearest"
# 400×480 BMP の4枚全てで確認した最終色段階。RGB は上位5/6/5 bitを展開する。
output_format = "rgb565"
# 位置・色順・透明度は補正なし。動く背景との差を係数に吸収しない。

build = "acnl_jpn_v15"
output = "src/game/generated/api.hpp"
namespace = "gohan::game::generated"
functions = [
    "GpuCmd_GetProperty", "GpuCmd_CreateLists", "GpuCmd_SelectList",
    "GpuCmd_AllocateListStorage", "GpuCmd_DestroyLists",
    "ssys_ma_Allocator_Alloc", "ssys_ma_Allocator_Free",
    "ssys_ma_lyt_Layout_RecordPaneTree", "ssys_ma_lyt_Layout_ReplayRecordedList",
    "ssys_ma_lyt_Layout_SetupProjectionMatrix", "ssys_ma_lyt_LayoutMgr_AddLayout",
    "nwfont_TextBatch_Init", "nwlyt_TextBox_CalcDrawBufferBytes",
    # 帯の Picture の描画と、描画の状態に溜まった板のバッチの流し出し。後者の型は symbols に無い。
    "nwlyt_Picture_DrawToCommandList", "DrawCtx_FlushBatch",
]
# 自前の Layout ノード・Pane 木・フォントの仮想表と、導入前に確かめる大域変数。
globals = [
    "g_LayoutMgr", "g_LayoutAllocator", "vtbl_sead_CtrController",
    "vtbl_ssys_ma_lyt_Layout", "vtbl_nw_lyt_Pane", "vtbl_nw_lyt_Picture", "vtbl_nw_lyt_TextBox",
    "vtbl_nw_lyt_Material", "vtbl_nw_lyt_DrawInfo", "vtbl_nw_font_ResFont",
    "vtbl_nw_font_TagProcessorBase_wchar_t", "g_DefaultWideTagProcessor", "vtbl_sead_ExpHeap",
]
types = [
    "SsysMaLayoutMgr", "SsysMaLayoutList", "SsysMaLayoutNode", "SsysMaLayoutNodeVtable",
    "SsysMaAllocator", "SeadExpHeapPrefix",
    "NwLytPane", "NwLytPicture", "NwLytTextBox", "NwLytMaterial", "NwLytDrawInfo",
    "NwLytTexMap", "NwLytTexSrt", "NwLytTexCoordGen", "NwLytAlphaCompare", "NwLytBlendMode",
    "NwLytTevStage", "NwLytMaterialCountMask", "NwLytAnimationLinkList",
    "NwFontResFont", "NwFontFinf", "NwFontTglp", "NwFontCwdh", "NwFontCmap",
    "NwFontCharWidths", "NwFontCmapScanPrefix", "NwFontCmapScanPair",
    "NwFontGlyphTextureDescriptor", "NwFontTextBatchPrefix", "NwFontTextBatchGlyph",
    "NwFontTagProcessor",
    "SeadControllerBasePrefix", "SeadControllerPrefix", "SeadControllerWrapperPrefix",
    "SeadOffsetList", "AcnlPadReaderPrefix", "AcnlPadState",
    "AcnlUiPoint2", "AcnlUiPoint2I", "AcnlPointerFlags",
]

# 描画パス中の待機後、追加の毎フレーム処理を呼ぶ位置。
[[hooks]]
name = "FrameDispatch"
function = "Frame_DrawPass1024"
offset = 88
length = 16

# 入力を読む直後と、押下・離しを作る直前。
[[hooks]]
name = "InputPadRead"
function = "GameInput_ReadPadState"
offset = 248
length = 16

[[hooks]]
name = "InputControllerCalc"
function = "sead_Controller_Calc"
offset = 36
length = 16


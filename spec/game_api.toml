# 成長の戻り先は上の BLX 照合範囲の直後（caller_addr + caller_len、LR の bit0 を除く）。
# bit0 を除いた命令先頭が基準。戻り先は Field_GrowUpWiltBushSapling +0x52、
# Field_GrowUpWiltSapling +0x6E / +0xFC、Field_GrowUpWiltSaplingToItem3 +0x52、ToItem4 +0x52。
# 呼び出せる先頭（Thumb の +1 付き）からは、それぞれ +0x51、+0x6D / +0xFB、+0x51、+0x51。
# 関数末尾に 2 バイトしか残らない物もあるため、4 バイトの CRC は直前の BLX で取る。


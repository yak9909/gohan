name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python tools/check.py --all
      - run: python -m pytest tests/tools
